<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเก็บขยะ (Modern UI)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 

<style>
    body {
        font-family: 'Sarabun', sans-serif; 
        background-color: #f0f2f5;
        margin: 0;
        min-height: 100vh; 
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 15px; 
    }

    /* หน้าจอ Login */
    #auth-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: white;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #auth-box {
        background: #fff;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        width: 80%;
        max-width: 320px;
        display: none; /* ซ่อนไว้ก่อนจนกว่าจะเช็ค LocalStorage เสร็จ */
    }
    
    .pin-input {
        width: 100%;
        padding: 12px;
        margin: 15px 0;
        font-size: 18px;
        text-align: center;
        border: 2px solid #ddd;
        border-radius: 10px;
        box-sizing: border-box;
        font-family: 'Sarabun', sans-serif;
    }

    .pin-input:focus {
        border-color: #007bff;
        outline: none;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
        font-family: 'Sarabun', sans-serif;
    }

    .login-btn:hover { background-color: #0056b3; }

    #app-content {
        display: none; 
        width: 100%;
        max-width: 480px;
        flex-direction: column;
        align-items: center;
    }

    /* === CSS เดิมของถังขยะ === */
    .bin-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        width: 100%;
        max-width: 480px;
        gap: 15px;
        margin-bottom: 20px; 
    }
    .bin-card {
        display: flex; flex-direction: column; justify-content: space-evenly; 
        align-items: center; text-align: center; padding: 15px 8px;
        border-radius: 16px; background-color: #ffffff;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08); transition: transform 0.1s, box-shadow 0.2s;
        min-height: 200px; cursor: pointer;
    }
    .bin-card:active { transform: scale(0.97); box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
    .bin-card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 10px; }
    .bin-card p { font-weight: 700; font-size: 14px; color: #333; margin: 0; }
    .counter { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
    .count-btn { background-color: #007bff; border: none; color: white; font-size: 1.2rem; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; font-weight: 700; box-shadow: 0 2px 5px rgba(0, 123, 255, 0.4); }
    .count-btn:hover { background-color: #0056b3; }
    .count-btn:active { transform: scale(0.95); }
    .count { font-size: 1.3rem; font-weight: 700; min-width: 30px; text-align: center; color: #1a1a1a; }
    .action-footer { width: 100%; max-width: 480px; display: flex; justify-content: space-between; gap: 15px; margin-top: 15px; padding-bottom: 20px; }
    .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; padding: 15px; cursor: pointer; transition: all 0.2s ease; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
    .reset-btn { background: linear-gradient(45deg, #6c757d, #495057); }
    .send-btn { background: linear-gradient(45deg, #28a745, #1e7e34); }
    
    /* Loading Spinner */
    .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px auto;
        display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* สไตล์สำหรับปุ่มที่ถูกปิดการใช้งาน */
    button:disabled {
        opacity: 0.5;
        cursor: not-allowed !important;
        pointer-events: none;
    }

</style>
</head>
<body>

    <div id="auth-overlay">
        <div class="loader" id="checking-loader"></div>
        
        <div id="auth-box">
            <h3 style="margin-top:0; color: #333;">เข้าสู่ระบบ</h3>
            <p style="font-size: 14px; color: #666;">กรุณากรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
            <input type="password" id="pin-input" class="pin-input" placeholder="รหัสผ่าน" autocomplete="off">
            <button class="login-btn" onclick="verifyPin()">ยืนยัน</button>
            <div id="auth-msg" style="margin-top: 15px; color:#dc3545; font-size: 14px;"></div>
        </div>
    </div>

    <div id="app-content">
        <div class="bin-container">
            <div class="bin-card" id="red-bin">
                <img src="" alt="ถังขยะแดง" id="red-bin-img">
                <p>ขยะอันตรายอุตสาหกรรม</p>
                <div class="counter">
                    <button class="count-btn" onclick="changeCount('red', -1)">−</button>
                    <span id="count-red" class="count">0</span>
                    <button class="count-btn" onclick="changeCount('red', 1)">+</button>
                </div>
            </div>

            <div class="bin-card" id="green-bin">
                <img src="" alt="ถังขยะเขียว" id="green-bin-img">
                <p>ขยะรีไซเคิล</p>
                <div class="counter">
                    <button class="count-btn" onclick="changeCount('green', -1)">−</button>
                    <span id="count-green" class="count">0</span>
                    <button class="count-btn" onclick="changeCount('green', 1)">+</button>
                </div>
            </div>

            <div class="bin-card" id="black-bin">
                <img src="" alt="ถังขยะดำ" id="black-bin-img">
                <p>ขยะทั่วไป</p>
                <div class="counter">
                    <button class="count-btn" onclick="changeCount('black', -1)">−</button>
                    <span id="count-black" class="count">0</span>
                    <button class="count-btn" onclick="changeCount('black', 1)">+</button>
                </div>
            </div>

            <div class="bin-card" id="food-bin">
                <img src="" alt="ถังเศษอาหาร" id="food-bin-img">
                <p>ถังเศษอาหาร</p>
                <div class="counter">
                    <button class="count-btn" onclick="changeCount('food', -1)">−</button>
                    <span id="count-food" class="count">0</span>
                    <button class="count-btn" onclick="changeCount('food', 1)">+</button>
                </div>
            </div>
        </div>

        <div class="action-footer">
            <button class="btn reset-btn" onclick="clearCounts()">
                <i class="fas fa-redo"></i> รีเซ็ต
            </button>
            <button class="btn send-btn" onclick="submitData()">
                <i class="fas fa-paper-plane"></i> ส่งข้อมูล
            </button>
        </div>
    </div>

<script>
    // URL สำหรับตรวจสอบรหัสผ่าน (เอา URL ของ Apps Script ตัวใหม่มาใส่ตรงนี้)
    const VERIFY_URL = "https://script.google.com/macros/s/AKfycbxEt37N-cRJDzvhKaiSjQumabkNS36wdVZRvB2-95ezHfcW-OUHj7oVbx9x07FINoFo6Q/exec"; 

    window.onload = function() {
        checkPermission();
    };

    function checkPermission() {
        const isApproved = localStorage.getItem("waste_app_approved");
        
        if (isApproved === "true") {
            // เคยล็อคอินผ่านแล้ว ให้โชว์หน้าแอพเลย
            showAppContent();
        } else {
            // ยังไม่ผ่าน ให้โชว์กล่องใส่รหัส
            document.getElementById("auth-box").style.display = "block";
            document.getElementById("checking-loader").style.display = "none";
        }
    }

    function verifyPin() {
        const pinInput = document.getElementById("pin-input").value;
        const msgBox = document.getElementById("auth-msg");

        if(!pinInput) {
            msgBox.innerText = "กรุณากรอกรหัสผ่าน";
            return;
        }

        // ซ่อนฟอร์ม, โชว์โหลด
        document.getElementById("auth-box").style.display = "none";
        document.getElementById("checking-loader").style.display = "block";

        // ส่งรหัสไปตรวจสอบที่ Google Apps Script
        fetch(VERIFY_URL, {
            method: "POST",
            body: JSON.stringify({ 
                action: "check_pin",
                pin: pinInput 
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "approved") { 
                // รหัสถูกต้อง!
                localStorage.setItem("waste_app_approved", "true");
                showAppContent();
            } else {
                // รหัสผิด
                document.getElementById("auth-box").style.display = "block";
                document.getElementById("checking-loader").style.display = "none";
                msgBox.innerText = "รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่";
                document.getElementById("pin-input").value = ""; // ล้างช่องใส่รหัส
            }
        })
        .catch(error => {
            console.error("Error:", error);
            document.getElementById("auth-box").style.display = "block";
            document.getElementById("checking-loader").style.display = "none";
            msgBox.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
        });
    }

    function showAppContent() {
        document.getElementById("auth-overlay").style.display = "none";
        document.getElementById("app-content").style.display = "flex"; 
    }

    // ============================================
    // ส่วนเก็บและส่งข้อมูลเดิม
    // ============================================
    const counts = { red: 0, green: 0, black: 0, food: 0 };

    function changeCount(color, delta) {
        counts[color] = Math.max(0, counts[color] + delta);
        document.getElementById(`count-${color}`).innerText = counts[color];
    }

    function clearCounts() {
        for (const bin in counts) {
            counts[bin] = 0;
            document.getElementById(`count-${bin}`).innerText = 0;
        }
    }

function submitData() {
        let message = `ข้อมูลที่บันทึก:\nแดง (อันตราย): ${counts.red}\nเขียว (รีไซเคิล): ${counts.green}\nดำ (ทั่วไป): ${counts.black}\nเศษอาหาร: ${counts.food}`;

        // ใช้ confirm เพื่อให้ผู้ใช้กดยืนยันก่อนส่ง
        if (!confirm(message + '\n\nคุณต้องการส่งข้อมูลใช่หรือไม่?')) {
            return; // ถ้ายกเลิก ก็หยุดการทำงาน
        }

        // 1. ปิดการใช้งานปุ่มทั้งหมดในหน้าเว็บ
        const allButtons = document.querySelectorAll('button');
        allButtons.forEach(btn => btn.disabled = true);

        // เปลี่ยนข้อความปุ่มส่งข้อมูลเพื่อให้รู้ว่ากำลังโหลด
        const sendBtn = document.querySelector('.send-btn');
        const originalBtnHtml = sendBtn.innerHTML;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังส่งข้อมูล...';

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const dateTimeStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const dateOnlyStr = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;

        const payload = {
            A: "15",
            B: "ข้าง RM Pulpit",
            C: counts.red,
            D: counts.green,
            E: counts.black,
            F: counts.food,
            G: dateTimeStr,
            H: dateOnlyStr
        };

        // URL ส่งข้อมูลขยะ
        fetch("https://script.google.com/macros/s/AKfycbzKD78PXUC09K0oitJlBHqNq6HAzKz4cVLSSYj-fPJ-FGb_dOwGc8pIV3YYj8RHdBMgkA/exec", {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("ส่งข้อมูลเรียบร้อยแล้ว!");
            clearCounts(); 
            
            // 2. สั่งปิดแท็บหน้าต่างเบราว์เซอร์
            window.close(); 

            // เผื่อในกรณีที่เบราว์เซอร์บล็อกการทำงานของ window.close() (ข้อจำกัดด้านความปลอดภัย)
            // เราจะแสดงหน้าจอแจ้งเตือนให้ผู้ใช้ปิดแท็บเอง
            document.body.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;">
                    <i class="fas fa-check-circle" style="font-size: 60px; color: #28a745; margin-bottom: 20px;"></i>
                    <h2 style="color: #333; font-family: 'Sarabun', sans-serif;">ส่งข้อมูลสำเร็จ</h2>
                    <p style="color: #666; font-family: 'Sarabun', sans-serif;">ระบบได้บันทึกข้อมูลแล้ว คุณสามารถปิดหน้านี้ได้เลย</p>
                </div>
            `;
        }).catch(err => {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
            
            // ถ้าส่งไม่สำเร็จ ให้เปิดการใช้งานปุ่มกลับมาเหมือนเดิม
            allButtons.forEach(btn => btn.disabled = false);
            sendBtn.innerHTML = originalBtnHtml;
        });
    }




   
</script>

</body>
</html>
